<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Card Digitizer</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2433; --muted:#667085; --brand:#2563eb; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); line-height:1.4; }
  header { background:var(--brand); color:#fff; padding:18px 16px; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:4px 0 0; opacity:.9; font-size:.95rem; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .btn { display:block; width:100%; min-height:56px; padding:14px; font-size:1.1rem; font-weight:600; border:0; border-radius:12px; background:var(--brand); color:#fff; cursor:pointer; text-align:center; }
  .btn.alt { background:#fff; color:var(--brand); border:2px solid var(--brand); }
  .btn.ok { background:var(--ok); }
  .btn.small { min-height:44px; font-size:1rem; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:grid; gap:10px; grid-template-columns:1fr; margin-bottom:12px; }
  @media (min-width:520px){ .row.two { grid-template-columns:1fr 1fr; } }
  input[type=file] { display:none; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; font-size:.85rem; margin:8px 0 16px; }
  .tag { padding:3px 10px; border-radius:99px; border:2px solid; background:#fff; }
  .tag.u { border-color:var(--warn); } .tag.m { border-color:var(--bad); } .tag.g { border-color:var(--ok); }
  #summary { font-weight:600; margin:8px 0; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.1); border:3px solid transparent; }
  .card.confirmed { border-color:var(--ok); }
  .card img { width:100%; max-height:220px; object-fit:contain; background:#eef0f4; border-radius:8px; }
  .status { margin:10px 0; padding:10px; border-radius:8px; background:#eef2ff; font-size:.95rem; }
  .status.failed { background:#fee2e2; color:#7f1d1d; }
  .status.done { background:#dcfce7; color:#14532d; }
  .field { margin:10px 0; padding:8px; border-radius:10px; border:2px solid #d0d5dd; }
  .field.uncertain { border-color:var(--warn); background:#fffbeb; }
  .field.missing { border-color:var(--bad); background:#fef2f2; }
  .field label { display:flex; justify-content:space-between; font-weight:600; font-size:.9rem; margin-bottom:4px; }
  .badge { font-weight:600; font-size:.8rem; }
  .field.uncertain .badge { color:#b45309; } .field.missing .badge { color:var(--bad); }
  .field input, .field textarea { width:100%; font-size:1.05rem; padding:12px; border:1px solid #cbd1da; border-radius:8px; font-family:inherit; }
  details { margin:8px 0; font-size:.9rem; color:var(--muted); }
  pre { white-space:pre-wrap; background:#f1f3f6; padding:8px; border-radius:6px; }
  .actions { display:grid; gap:10px; grid-template-columns:2fr 1fr; margin-top:12px; }
  .export { position:sticky; bottom:0; background:var(--bg); padding:12px 0; }
</style>
</head>
<body>
<header>
  <h1>📇 Business Card Digitizer</h1>
  <p>Photo → text → check → Excel. Everything stays in your browser.</p>
</header>

<main>
  <div class="row two">
    <label class="btn" for="galleryInput">🖼️ Choose from gallery</label>
    <label class="btn alt" for="cameraInput">📷 Take a photo</label>
  </div>
  <input type="file" id="galleryInput" accept="image/*" multiple>
  <input type="file" id="cameraInput" accept="image/*" capture="environment">

  <div class="legend">
    <span class="tag g">Green = confirmed card</span>
    <span class="tag u">Yellow = please check</span>
    <span class="tag m">Red = missing</span>
  </div>

  <div id="summary"></div>
  <div id="cards"></div>

  <div class="export">
    <button class="btn ok" id="exportBtn" disabled>⬇️ Download Excel (0 confirmed)</button>
  </div>
</main>

<!-- Libraries (loaded from the internet) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* ============ 1. SETTINGS ============ */
const FIELDS = [
  ['name', 'Name'], ['company', 'Company Name'], ['title', 'Job Title'],
  ['address', 'Address'], ['email', 'Email'],
  ['personalPhone', 'Personal Phone'], ['companyPhone', 'Company Phone'],
  ['website', 'Website']
];

/* ============ 2. STATE: one object per card ============ */
const cards = [];   // each: {id, file, url, status, values, flags, raw, confirmed, el}
let nextId = 1, worker = null, running = false;

/* ============ 3. ADDING IMAGES ============ */
document.getElementById('galleryInput').addEventListener('change', e => addFiles(e.target.files));
document.getElementById('cameraInput').addEventListener('change', e => addFiles(e.target.files));

function addFiles(fileList) {
  for (const file of fileList) {
    if (!file.type.startsWith('image/')) continue;
    const c = { id: nextId++, file, url: URL.createObjectURL(file), status: 'queued',
                values: {}, flags: {}, raw: '', confirmed: false, progress: 0, el: null };
    FIELDS.forEach(([k]) => { c.values[k] = ''; c.flags[k] = 'missing'; });
    cards.push(c);
    const el = document.createElement('div');
    c.el = el;
    document.getElementById('cards').appendChild(el);
    renderCard(c);
  }
  // reset inputs so the same photo can be picked again
  document.getElementById('galleryInput').value = '';
  document.getElementById('cameraInput').value = '';
  updateSummary();
  processQueue();
}

/* ============ 4. OCR (one card at a time; a failure never stops the others) ============ */
async function getWorker() {
  if (typeof Tesseract === 'undefined') throw new Error('OCR library did not load (are you online?)');
  if (!worker) worker = await Tesseract.createWorker('eng', 1, {
    logger: m => { if (current && m.status === 'recognizing text') { current.progress = Math.round(m.progress * 100); setStatusText(current); } }
  });
  return worker;
}
let current = null;

async function processQueue() {
  if (running) return;
  running = true;
  while (true) {
    const c = cards.find(x => x.status === 'queued');
    if (!c) break;
    current = c;
    c.status = 'reading'; renderCard(c);
    try {
      const w = await getWorker();
      const img = await shrinkImage(c.file);
      const { data } = await w.recognize(img);
      c.raw = data.text || '';
      if (c.raw.trim().length < 5) throw new Error('No readable text found in this image');
      const result = extract(c.raw, data.confidence);
      c.values = result.values; c.flags = result.flags;
      c.status = 'done';
    } catch (err) {
      console.error(err);
      c.status = 'failed'; c.error = err.message || String(err);
    }
    renderCard(c);
    updateSummary();
  }
  current = null; running = false;
}

// Big phone photos are slow to read, so scale them down to max 1800px wide/high.
async function shrinkImage(file) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    return await new Promise(res => canvas.toBlob(res, 'image/png'));
  } catch { return file; }
}

/* ============ 5. EXTRACTION: simple "best guess" rules ============ */
function extract(text, confidence) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 1);
  const used = new Set();
  const v = {}, f = {};
  const lowConf = confidence < 60;
  const put = (key, val, flag = 'ok') => { v[key] = val || ''; f[key] = val ? (lowConf && flag === 'ok' ? 'uncertain' : flag) : 'missing'; };
  const mark = pred => lines.forEach((l, i) => { if (pred(l)) used.add(i); });

  // Email
  const em = text.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/);
  put('email', em && em[0]);
  if (em) mark(l => l.includes(em[0]));

  // Website (look at text with the email removed so the email domain isn't mistaken for a website)
  const noEmail = text.replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g, ' ');
  const web = noEmail.match(/(?:https?:\/\/)?www\.[^\s,;]+|\b[a-z0-9-]+\.(?:com|in|net|org|io|co|biz|info|tech)(?:\.[a-z]{2})?\b[^\s,;]*/i);
  put('website', web && web[0]);
  if (web) mark(l => l.includes(web[0]));

  // Phones: personal vs company decided by hints like "Mob", "Cell", "Tel", "Office"
  let personal = '', company = '', personalFlag = 'ok', companyFlag = 'ok';
  const unhinted = [];
  lines.forEach((line, i) => {
    const m = line.replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g, '').match(/\+?\d[\d\s().-]{6,}\d/);
    if (!m) return;
    const digits = m[0].replace(/\D/g, '');
    if (digits.length < 8 || digits.length > 15) return;
    used.add(i);
    if (/fax/i.test(line)) return;
    const num = m[0].trim();
    if (/mob|cell|personal|\bm\s*[:.-]|whatsapp/i.test(line)) { if (!personal) personal = num; }
    else if (/tel|office|landline|\bph\b|\bt\s*[:.-]|phone/i.test(line)) { if (!company) company = num; }
    else unhinted.push(num);
  });
  unhinted.forEach(n => {
    if (!company) { company = n; companyFlag = 'uncertain'; }
    else if (!personal) { personal = n; personalFlag = 'uncertain'; }
  });
  put('personalPhone', personal, personalFlag);
  put('companyPhone', company, companyFlag);

  // Job title
  const TITLE = /(manager|director|ceo|cto|cfo|coo|founder|president|engineer|developer|consultant|executive|officer|head|lead|partner|analyst|designer|architect|sales|marketing|proprietor|owner|\bvp\b|vice|chairman|specialist|associate)/i;
  const ti = lines.findIndex((l, i) => !used.has(i) && TITLE.test(l) && l.length < 60);
  put('title', ti >= 0 ? lines[ti] : '');
  if (ti >= 0) used.add(ti);

  // Company
  const COMP = /(pvt|ltd|llp|inc\b|llc|corp|company|\bco\b|technolog|solution|systems|industries|enterprise|group|services|consult|labs|global|associates|studio|bank)/i;
  const ci = lines.findIndex((l, i) => !used.has(i) && COMP.test(l));
  put('company', ci >= 0 ? lines[ci] : '', 'uncertain');
  if (ci >= 0) used.add(ci);

  // Address: lines that look like street/city/pin code
  const ADDR = /(road|\brd\b|street|\bst\b|floor|nagar|plot|sector|building|tower|park|lane|avenue|near|opp|\b\d{6}\b|\bpin\b|mumbai|delhi|bangalore|bengaluru|pune|chennai|hyderabad|kolkata|india)/i;
  const addrLines = lines.filter((l, i) => { const ok = !used.has(i) && (ADDR.test(l) || (/,/.test(l) && /\d/.test(l))); if (ok) used.add(i); return ok; });
  put('address', addrLines.join(', '), 'uncertain');

  // Name: first remaining short line made of 2-4 words with only letters
  const ni = lines.findIndex((l, i) => !used.has(i) && /^[A-Za-z.'\- ]+$/.test(l) && l.split(/\s+/).length >= 2 && l.split(/\s+/).length <= 4);
  put('name', ni >= 0 ? lines[ni] : '', ni >= 0 && ni <= 2 ? 'ok' : 'uncertain');

  return { values: v, flags: f };
}

/* ============ 6. SCREEN: draw one card ============ */
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
const BADGE = { ok: '', uncertain: '⚠ Please check', missing: '✖ Missing' };

function statusHTML(c) {
  if (c.status === 'queued')  return '<div class="status">⏳ Waiting in line…</div>';
  if (c.status === 'reading') return `<div class="status">🔍 Reading card… ${c.progress}%</div>`;
  if (c.status === 'failed')  return `<div class="status failed">⚠️ Could not read this card automatically (${esc(c.error)}). Please type the details below. Your other cards are not affected.</div>`;
  return '<div class="status done">✅ Reading finished. Check yellow and red fields, then confirm.</div>';
}
function setStatusText(c) { const s = c.el.querySelector('.status'); if (s) s.innerHTML = `🔍 Reading card… ${c.progress}%`; }

function renderCard(c) {
  const el = c.el;
  el.className = 'card' + (c.confirmed ? ' confirmed' : '');
  const busy = c.status === 'queued' || c.status === 'reading';
  const fieldsHTML = FIELDS.map(([k, label]) => {
    const input = k === 'address'
      ? `<textarea rows="2" data-k="${k}" ${c.confirmed || busy ? 'disabled' : ''}>${esc(c.values[k])}</textarea>`
      : `<input type="text" data-k="${k}" value="${esc(c.values[k])}" ${c.confirmed || busy ? 'disabled' : ''}>`;
    return `<div class="field ${busy ? '' : c.flags[k]}" data-f="${k}">
      <label>${label}<span class="badge">${busy ? '' : BADGE[c.flags[k]]}</span></label>${input}</div>`;
  }).join('');
  el.innerHTML = `
    <img src="${c.url}" alt="Business card ${c.id}">
    ${statusHTML(c)}
    ${fieldsHTML}
    ${c.raw ? `<details><summary>Show raw OCR text</summary><pre>${esc(c.raw)}</pre></details>` : ''}
    <div class="actions">
      <button class="btn ${c.confirmed ? 'alt' : 'ok'} small" data-act="confirm" ${busy ? 'disabled' : ''}>${c.confirmed ? '✏️ Edit again' : '✔ Confirm card'}</button>
      <button class="btn alt small" data-act="remove">🗑 Remove</button>
    </div>`;

  // typing in a field: save value and clear the highlight if something was entered
  el.querySelectorAll('[data-k]').forEach(inp => inp.addEventListener('input', () => {
    const k = inp.dataset.k;
    c.values[k] = inp.value;
    c.flags[k] = inp.value.trim() ? 'ok' : 'missing';
    const box = el.querySelector(`[data-f="${k}"]`);
    box.className = 'field ' + c.flags[k];
    box.querySelector('.badge').textContent = BADGE[c.flags[k]];
  }));
  el.querySelector('[data-act="confirm"]').onclick = () => toggleConfirm(c);
  el.querySelector('[data-act="remove"]').onclick = () => removeCard(c);
}

function toggleConfirm(c) {
  if (!c.confirmed) {
    const missing = FIELDS.filter(([k]) => !c.values[k].trim()).map(f => f[1]);
    if (missing.length && !confirm('These fields are empty: ' + missing.join(', ') + '.\nConfirm anyway?')) return;
  }
  c.confirmed = !c.confirmed;
  renderCard(c); updateSummary();
}
function removeCard(c) {
  if (!confirm('Remove this card?')) return;
  cards.splice(cards.indexOf(c), 1);
  c.el.remove(); URL.revokeObjectURL(c.url); updateSummary();
}

function updateSummary() {
  const done = cards.filter(c => c.confirmed).length;
  document.getElementById('summary').textContent = cards.length
    ? `${cards.length} card(s) added · ${done} confirmed` : 'No cards yet. Add some photos to begin.';
  const btn = document.getElementById('exportBtn');
  btn.disabled = done === 0;
  btn.textContent = `⬇️ Download Excel (${done} confirmed)`;
}

/* ============ 7. EXCEL EXPORT (SheetJS): one row per confirmed card ============ */
document.getElementById('exportBtn').addEventListener('click', () => {
  if (typeof XLSX === 'undefined') { alert('Excel library did not load. Check your internet connection.'); return; }
  const rows = cards.filter(c => c.confirmed).map(c => {
    const row = {};
    FIELDS.forEach(([k, label]) => row[label] = c.values[k].trim());
    return row;
  });
  const sheet = XLSX.utils.json_to_sheet(rows, { header: FIELDS.map(f => f[1]) });
  sheet['!cols'] = FIELDS.map(() => ({ wch: 24 }));
  const book = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(book, sheet, 'Business Cards');
  XLSX.writeFile(book, 'business_cards.xlsx');
});

updateSummary();
</script>
</body>
</html>
